[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "claude-away"
version = "0.0.1"
description = "Capacity-aware autonomous work planning for Claude Code: deterministic state core."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "xcrrr", email = "119807481+xcrrr@users.noreply.github.com" }]
keywords = ["claude-code", "automation", "agents", "state-machine", "autonomous-coding"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]

# Runtime dependency surface is deliberately tiny. `jsonschema` is the single
# third-party runtime dependency: it buys us a correct, well-tested Draft 2020-12
# implementation for the published schema contracts, which we would otherwise have
# to reimplement badly.
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/xcrrr/claude-away"
Repository = "https://github.com/xcrrr/claude-away"
Issues = "https://github.com/xcrrr/claude-away/issues"

[project.scripts]
awayctl = "claude_away.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_away"]

# The published JSON Schema contracts live at the repository root (they are part of
# the project's public interface, not only a Python detail). Ship them inside the
# wheel so schema validation works from an installed package.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "claude_away/_schemas"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "C4",   # comprehensions
  "DTZ",  # flake8-datetimez -- we require timezone-aware UTC everywhere
  "PTH",  # prefer pathlib
  "RET",  # return simplifications
  "ARG",  # unused arguments
]
ignore = [
  "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
# Without this, `tests.conftest` is classified as third-party and ruff and the formatter
# disagree about where it belongs, which makes `ruff check` non-idempotent.
known-first-party = ["claude_away", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use magic values and long parameterisations.
"tests/**" = ["ARG001", "ARG002", "B011"]

[tool.mypy]
python_version = "3.10"
files = ["src/claude_away", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
# Tests are type-checked but we do not demand full annotations on every fixture.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: tests that take a noticeable amount of wall-clock time",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["claude_away"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
