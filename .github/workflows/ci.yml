name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Cancel superseded runs on the same ref; a stale run is not useful signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: Mypy
        run: mypy

  test:
    name: Tests (Linux, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # macOS is included now because the deterministic core touches filesystem and
  # SQLite locking behaviour, which is where cross-platform surprises actually live.
  # Windows is deliberately deferred to the v0.1 release-hardening milestone (see
  # docs/ROADMAP.md) rather than being added as a job that we do not yet honour.
  test-macos:
    name: Tests (macOS, py3.12)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest
        run: pytest

  packaging:
    name: Clean-environment install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Proves the Definition-of-Done requirement that the package installs in a
      # clean environment and the console entry point actually works from a wheel,
      # not only from an editable checkout.
      - name: Build and install wheel in an isolated venv
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/python -m pip install dist/*.whl
          /tmp/cleanenv/bin/awayctl version
          /tmp/cleanenv/bin/awayctl --help
